[package]
name = "svg_path_ops"
version = "0.12.0"
edition = "2021"
authors = ["orhanbalci@gmail.com <orhanbalci@gmail.com>"]
description = "SVG Path Manipulation Utilities"
repository = "https://github.com/orhanbalci/rough-rs.git"
homepage = "https://github.com/orhanbalci"
keywords = ["graphics", "bezier", "sketch", "2D", "svg"]
categories = ["graphics"]
license = "MIT"
readme = "README.md"
# Images are linked from GitHub, so they do not need to ship in the package
exclude = ["assets/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
svgtypes = "0.16"
kurbo = { version = "0.13", features = ["euclid"] }
euclid = "0.22"
i_overlay = { version = "9", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ops"
harness = false
required-features = ["boolean"]

[features]
default = ["boolean"]
# Boolean operations on paths, through i_overlay
boolean = ["dep:i_overlay"]
